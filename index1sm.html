<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unity Web Player | Hollow Knight SilkSong</title>
  <style>
    html, body { margin: 0; padding: 0; background: #000; width: 100%; height: 100%; overflow: hidden; }
    #loading-text { color: white; font: 24px Arial, sans-serif; text-align: center; padding: 20px; }
    #unity-container { width: 100%; height: calc(100% - 70px); display: flex; justify-content: center; align-items: center; }
    #unity-canvas { width: min(100vw, 960px); height: min(62.5vw, 600px); max-width: 960px; max-height: 600px; background: #000; }
    #unity-loading-bar { width: min(80vw, 600px); position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: none; }
    #unity-progress-bar-empty { width: 100%; height: 12px; background: #333; }
    #unity-progress-bar-full { width: 0%; height: 100%; background: #fff; }
    #unity-warning { position: absolute; left: 0; right: 0; top: 0; z-index: 10; }
  </style>
  <script src="https://truffled.lol/games/silk/jszip.js"></script>
</head>
<body>
  <div id="loading-text">LOADING...</div>
  <div id="unity-container">
    <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
    </div>
    <div id="unity-warning"></div>
  </div>

<script>
(() => {
  const ROOT = "https://truffled.lol/games/silk/";
  const loadingText = document.getElementById("loading-text");
  const canvas = document.getElementById("unity-canvas");
  const loadingBar = document.getElementById("unity-loading-bar");
  const progressBarFull = document.getElementById("unity-progress-bar-full");
  const warningBanner = document.getElementById("unity-warning");
  const CACHE_NAME = "hksilksongcache-truffled-v2";
  const originalFetch = window.fetch.bind(window);

  function setStatus(s) { loadingText.textContent = s; }
  function unityShowBanner(msg, type) {
    const div = document.createElement("div");
    div.innerHTML = msg;
    div.style.padding = "10px";
    div.style.background = type === "error" ? "#b00020" : "#d8b400";
    div.style.color = "white";
    warningBanner.appendChild(div);
  }

  async function getCache() {
    if (!window.isSecureContext || !window.caches) {
      throw new Error("This build must be opened from HTTPS (for example GitHub Pages), not by double-clicking index.html.");
    }
    return caches.open(CACHE_NAME);
  }

  const originalFetchForAssets = originalFetch;
  window.fetch = async function(resource, options) {
    const url = typeof resource === "string" ? resource : resource.url;
    try {
      const cache = await getCache();
      const key = url.split("?")[0];
      const cached = await cache.match(key);
      if (cached) return cached;
    } catch (_) {}
    return originalFetchForAssets(resource, options);
  };

  async function isCached() {
    const cache = await getCache();
    return !!(await cache.match(ROOT + "CACHE_COMPLETE"));
  }

  async function unzipAndStore(zipBlob) {
    if (!window.JSZip) throw new Error("JSZip failed to load.");
    setStatus("EXTRACTING ASSETS...");
    const zip = await JSZip.loadAsync(zipBlob);
    const files = Object.values(zip.files).filter(f => !f.dir);
    const cache = await getCache();
    let processed = 0;
    const batchSize = 10;

    for (let i = 0; i < files.length; i += batchSize) {
      await Promise.all(files.slice(i, i + batchSize).map(async file => {
        const blob = await file.async("blob");
        await cache.put(ROOT + file.name, new Response(blob));
        processed++;
        setStatus(`EXTRACTING ASSETS... (${processed}/${files.length})`);
      }));
      await new Promise(r => setTimeout(r, 0));
    }
    await cache.put(ROOT + "CACHE_COMPLETE", new Response("ok"));
  }

  let loadedBytes = 0;
  async function fetchWithProgress(url) {
    const response = await originalFetchForAssets(url);
    if (!response.ok) throw new Error(`Failed to fetch ${url} (HTTP ${response.status})`);
    if (!response.body) return response.arrayBuffer();
    const reader = response.body.getReader();
    const chunks = [];
    let received = 0;
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      chunks.push(value);
      received += value.length;
      loadedBytes += value.length;
      setStatus(`DOWNLOADING ASSETS... (${(loadedBytes / 1048576).toFixed(2)} MB)`);
    }
    const buffer = new Uint8Array(received);
    let offset = 0;
    for (const chunk of chunks) { buffer.set(chunk, offset); offset += chunk.length; }
    return buffer.buffer;
  }

  async function mergeFiles(parts) {
    const buffers = await Promise.all(parts.map(fetchWithProgress));
    return new Blob(buffers);
  }

  function getParts(file, start, end) {
    const parts = [];
    for (let i = start; i <= end; i++) parts.push(ROOT + file + ".part" + i);
    return parts;
  }

  async function start() {
    try {
      if (!(await isCached())) {
        setStatus("DOWNLOADING ASSETS... FIRST LOAD CAN TAKE A WHILE.");
        const zip = await mergeFiles(getParts("StreamingAssets/aa/WebGL.zip", 1, 100));
        await unzipAndStore(zip);
      } else {
        setStatus("LOADING FROM CACHE...");
      }

      loadingBar.style.display = "block";
      setStatus("STARTING UNITY...");

      const script = document.createElement("script");
      script.src = ROOT + "Build/w-pt.loader.js";
      script.onload = async () => {
        try {
          await createUnityInstance(canvas, {
            dataUrl: ROOT + "Build/w-pt.data.unityweb",
            frameworkUrl: ROOT + "Build/w-pt.framework.js.unityweb",
            codeUrl: ROOT + "Build/w-pt.wasm.unityweb",
            streamingAssetsUrl: ROOT + "StreamingAssets",
            companyName: "EDUrocks Group, Truffled, GN-Math",
            productName: "Hollow Knight SilkSong",
            productVersion: "1.0",
            showBanner: unityShowBanner
          }, progress => {
            progressBarFull.style.width = (progress * 100) + "%";
          });
          loadingBar.remove();
          loadingText.remove();
        } catch (e) {
          console.error(e);
          setStatus("UNITY ERROR: " + (e && e.message ? e.message : e));
        }
      };
      script.onerror = () => setStatus("ERROR: Could not load the Unity loader from Truffled.");
      document.body.appendChild(script);
    } catch (e) {
      console.error(e);
      setStatus("ERROR: " + (e && e.message ? e.message : e));
    }
  }

  start();
})();
</script>
</body>
</html>
